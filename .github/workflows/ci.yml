name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compiler
        run: cargo build
      - name: Lancer les tests
        run: cargo test